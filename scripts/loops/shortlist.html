<!doctype html>
<!--
  Shortlist's looping clip (the background of its project card): the funnel of postings.

  A loose cloud of points (the postings) comes in from the top without end.
  Seven thin horizontal lines stand across its way (the seven factors of the
  score): as a point crosses them it glides to its place. Below them the
  points leave in files, sorted from the highest score to the lowest; the few
  best light up in the card's blue and take the first files. Everything fades
  out before the last third of the frame, where the card's text goes.

  The look is the hero chip's (lib/chip-cloud.ts): crisp dots in a hierarchy of
  sizes, some depth, one accent colour. Colours come from the site's own
  stylesheet, linked below: the project cards' background (they are dark in
  both themes), the dark theme's ink and the "automation" domain's blue.

  Deterministic (seeded) and periodic: a frame depends only on a phase from 0
  to 1, and phase 1 draws the same picture as phase 0. Open it in a browser to
  watch it (add ?phase=0.25 for one still), or record it:

    node scripts/loops/record.mjs shortlist job-hunt-copilot
-->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Shortlist · loop</title>
    <link rel="stylesheet" href="../../app/globals.css" />
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: var(--project-card);
      }
      /* the card: its background, and its domain's colour */
      #card {
        position: relative;
        width: 600px;
        height: 900px;
        background: var(--project-card);
      }
      canvas {
        position: absolute;
        inset: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="card" data-domain="automation"><canvas id="scene" width="600" height="900"></canvas></div>
    <script>
      "use strict";
      /* ------------------------------ the clip ------------------------------ */
      const W = 600;
      const H = 900;
      const SECONDS = 7;
      const FPS = 24;

      /* ----------------------------- the journey ---------------------------- */
      // A point travels down SPAN px, from Y0, in TRIPS loops of the clip (all it shows of that is the frame's
      // upper two thirds). Every point has TRIPS - 1 twins on the same path, evenly ahead of it, so after one loop
      // each stands where a twin stood: the picture repeats. The pace is 3 px per frame (72 px a second; on the
      // card, about 32): a whole number, so a point in its file is drawn the same in every frame, crisp.
      const TRIPS = 2;
      const SPAN = 3 * SECONDS * FPS * TRIPS;
      const Y0 = -36.5;
      const MID = W / 2;
      /** the points fade in over this stretch (under the card's pills: nothing to read there)… */
      const FADE_IN = [24, 128];
      /** …and out over this one: nothing is left where the card's text starts, two thirds of the way down */
      const FADE_OUT = [514, 592];

      // the seven lines
      const GATES = 7;
      const GAP = 28;
      const gateY = (k) => 228 + k * GAP;
      /** half the width of the first line and of the last (px): they narrow like the funnel */
      const TAPER = [252, 212];
      // Where a point may glide from the cloud to its file: from just before the first line to just past the last.
      const GLIDE = [gateY(0) - 10, gateY(GATES - 1) + 28];
      /** how steep a glide may be on average (px sideways per px down), and the shortest one, as a share of the stretch */
      const SLOPE = 0.8;
      const SHORTEST = 0.45;

      /* ------------------------------ the points ---------------------------- */
      // Dot diameters, in the clip's pixels (a card shows it at about 270 px: divide by 2.2): the hero's hierarchy.
      const DOT = { xs: 3.4, s: 5, m: 7.4, l: 10.8, xl: 14.5 };
      // The files, first on the left: dot size, how far apart the file's points are (px: all a whole fraction of
      // 72, so the files line up in rows too), the gap to the next file and the file's opacity. Sorted: the larger
      // the dot, the higher its score. To the right the files are closer and fainter.
      const FILES = [
        { d: DOT.xl, pitch: 36, gap: 46, a: 1, best: true },
        { d: DOT.l, pitch: 24, gap: 40, a: 1, best: true },
        { d: DOT.m, pitch: 18, gap: 34, a: 1 },
        { d: DOT.m, pitch: 18, gap: 31, a: 1 },
        { d: DOT.s, pitch: 12, gap: 28, a: 1 },
        { d: DOT.s, pitch: 12, gap: 28, a: 0.96 },
        { d: DOT.s, pitch: 12, gap: 26, a: 0.92 },
        { d: DOT.s, pitch: 12, gap: 26, a: 0.88 },
        { d: DOT.xs, pitch: 9, gap: 24, a: 0.88 },
        { d: DOT.xs, pitch: 9, gap: 23, a: 0.82 },
        { d: DOT.xs, pitch: 9, gap: 22, a: 0.76 },
        { d: DOT.xs, pitch: 9, gap: 21, a: 0.7 },
        { d: DOT.xs, pitch: 9, gap: 20, a: 0.64 },
        { d: DOT.xs, pitch: 9, gap: 20, a: 0.58 },
        { d: DOT.xs, pitch: 9, gap: 0, a: 0.52 },
      ];
      // The cloud: a roll about the direction of travel that turns slowly as it comes down.
      const CLOUD = {
        /** how wide it is (px): most points within this of its axis, none further than `reach` times it */
        r: 110,
        reach: 2.1,
        /** how far it turns (rad) from the top to the end of the glides */
        turn: 1.1,
        /** each point's own place along the way is off by up to this (px) */
        jitter: 14,
        /** the drift, a slow flow that neighbours share (px) */
        drift: 10,
        /** the far side: this much smaller, and this faint */
        shrink: 0.3,
        fog: 0.5,
      };

      function mulberry32(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
      const smooth = (a, b, v) => {
        const t = clamp((v - a) / (b - a));
        return t * t * (3 - 2 * t);
      };
      const smoother = (t) => t * t * t * (t * (t * 6 - 15) + 10);
      const mix = (a, b, t) => a + (b - a) * t;

      const rnd = mulberry32(20261112);
      const width = FILES.reduce((s, f) => s + f.gap, 0);
      let fileX = Math.round(MID - width / 2) + 0.5;
      const points = [];
      FILES.forEach((file, f) => {
        const n = SPAN / file.pitch;
        const unique = n / TRIPS;
        if (!Number.isInteger(unique)) throw new Error(`file ${f}: ${file.pitch} px does not fit the journey`);
        const own = [];
        for (let j = 0; j < unique; j++) {
          // Where in the cloud, across the roll: a dense core that thins out (a bell). The angle 0 is the right of
          // the roll, and up to π its near side. The best come down on the near side (large), anywhere but its
          // far left: all of them have a way to go to the first files, on the left.
          const rad = file.best ? 0.3 + 1.4 * rnd() : Math.min(CLOUD.reach, Math.sqrt(-2 * Math.log(1 - rnd())));
          const angle = file.best ? 0.2 + 2.1 * rnd() - CLOUD.turn : rnd() * Math.PI * 2;
          // Its glide: as long as its way sideways asks for (the best, the whole stretch: a steady way to the
          // front), anywhere in the stretch. So past every line more points are already in their file.
          const away = Math.abs(MID + CLOUD.r * rad * Math.cos(angle + CLOUD.turn) - fileX);
          const whole = GLIDE[1] - GLIDE[0];
          const length = file.best ? whole : clamp(away / SLOPE, SHORTEST * whole, whole);
          const from = GLIDE[0] + rnd() * (whole - length);
          own.push({ rad, angle, from, to: from + length, jitter: rnd() * 2 - 1, faint: file.best || rnd() > 0.3 ? 1 : 0.75 });
        }
        for (let j = 0; j < n; j++) points.push({ ...own[j % unique], x: fileX, d: file.d, a: file.a, best: !!file.best, at: j / n });
        fileX += file.gap;
      });

      /* ------------------------------- the frame ---------------------------- */
      // The drift: the curl of three slow waves (so nothing piles up), each a whole number of cycles per loop.
      const WAVES = [
        [0.0093, 0.0131, 1, 0.4],
        [0.0157, -0.0072, -1, 2.1],
        [-0.0061, 0.0188, 2, 4.4],
      ];
      function drift(x, y, phase) {
        let dx = 0;
        let dy = 0;
        for (const [kx, ky, n, at] of WAVES) {
          const c = Math.cos(kx * x + ky * y + 2 * Math.PI * n * phase + at) / Math.hypot(kx, ky);
          dx += ky * c;
          dy -= kx * c;
        }
        return [(dx * CLOUD.drift) / WAVES.length, (dy * CLOUD.drift) / WAVES.length];
      }

      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");
      const css = getComputedStyle(document.getElementById("card"));
      // ink: the dark theme's text colour, at 85 % like the hero's cloud in the dark; accent: the card's domain
      const ink = css.getPropertyValue("--fg-rgb").trim().split(/\s+/).map(Number);
      const inkAlpha = 0.85;
      const accent = css.getPropertyValue("--d-rgb").trim().split(/\s+/).map(Number);
      if (![...ink, ...accent].every(Number.isFinite) || ink.length + accent.length !== 6) throw new Error("no colours: app/globals.css did not load, or its tokens changed");
      if (!css.getPropertyValue("--project-card").trim()) throw new Error("no background: --project-card is not in app/globals.css");
      const rgba = (c, a) => `rgb(${c[0]} ${c[1]} ${c[2]} / ${a.toFixed(3)})`;

      function draw(phase) {
        ctx.clearRect(0, 0, W, H);

        // the seven lines: hairlines that narrow like the funnel, and a slow emphasis that passes from one to the next
        for (let k = 0; k < GATES; k++) {
          const y = gateY(k);
          const half = mix(TAPER[0], TAPER[1], (k / (GATES - 1)) ** 0.7);
          const turn = ((phase - k / GATES) % 1 + 1) % 1;
          const glow = Math.max(0, Math.cos(2 * Math.PI * (turn > 0.5 ? turn - 1 : turn))) ** 3;
          const g = ctx.createLinearGradient(MID - half, 0, MID + half, 0);
          const a = (0.26 + 0.24 * glow) * inkAlpha;
          g.addColorStop(0, rgba(ink, 0));
          g.addColorStop(0.16, rgba(ink, a));
          g.addColorStop(0.84, rgba(ink, a));
          g.addColorStop(1, rgba(ink, 0));
          ctx.fillStyle = g;
          ctx.fillRect(MID - half, y - 1, 2 * half, 2);
        }

        const seen = [];
        for (const p of points) {
          const base = Y0 + SPAN * ((phase / TRIPS + p.at) % 1);
          if (base > FADE_OUT[1] + CLOUD.jitter + CLOUD.drift) continue;
          // in the cloud: on a roll that turns as it comes down, carried by the drift
          const angle = p.angle + CLOUD.turn * clamp((base - Y0) / (GLIDE[1] - Y0));
          const cx = MID + CLOUD.r * p.rad * Math.cos(angle);
          const [dx, dy] = drift(cx, base, phase);
          // …and from there to its place in its file, in one glide
          const left = 1 - smoother(clamp((base - p.from) / (p.to - p.from)));
          const x = p.x + (cx + dx - p.x) * left;
          const y = base + (p.jitter * CLOUD.jitter + dy) * left;
          const z = clamp((p.rad / CLOUD.reach) * 1.6 * Math.sin(angle), -1, 1) * left;
          const lit = p.best ? smooth(0.05, 0.95, 1 - left) : 0;
          const far = smooth(0.7, -1, z);
          const size = p.d * (1 + CLOUD.shrink * z) * (1 + 0.08 * lit);
          const edge = smooth(FADE_IN[0], FADE_IN[1], y) * (1 - smooth(FADE_OUT[0], FADE_OUT[1], y));
          const alpha = mix(p.a, p.faint * mix(1, CLOUD.fog, far), left) * edge;
          if (alpha > 0.004) seen.push({ x, y, z, size, alpha, lit, best: p.best });
        }
        // far ones first; the best over everything
        seen.sort((a, b) => Number(a.best) - Number(b.best) || a.z - b.z);
        for (const s of seen) {
          const colour = s.lit > 0 ? ink.map((c, i) => Math.round(mix(c, accent[i], s.lit))) : ink;
          const alpha = s.alpha * mix(inkAlpha, 1, s.lit);
          if (s.lit > 0.02) {
            ctx.fillStyle = rgba(accent, 0.14 * s.lit * s.alpha);
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size * 0.86, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = rgba(colour, alpha);
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size / 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // What the recorder uses: the clip's size and length, and one frame at a phase.
      window.loop = { width: W, height: H, seconds: SECONDS, fps: FPS, draw };

      const still = new URLSearchParams(location.search).get("phase");
      if (still !== null) draw(Number(still));
      else if (!navigator.webdriver) {
        const from = performance.now();
        const tick = (now) => {
          draw((((now - from) / 1000 / SECONDS) % 1 + 1) % 1);
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      } else draw(0);
    </script>
  </body>
</html>
