<!doctype html>
<!--
  The looping clip at the top of the "AI agent for data-center cooling" card:
  air between racks.

  A row of four racks as a cloud of points, in a three-quarter view from above
  (crisp edges, a fine grain on the faces, slats and lamps on the doors), and
  a sheet of air in dotted lines, like smoke in a wind tunnel: it comes in
  amber from behind, parts around each rack, runs through the gaps and leaves
  cyan in front. A few lamps beat slowly. Illustrative: nothing in it is a
  measurement.

  The look is the hero chip's (lib/chip-cloud.ts): crisp dots in a hierarchy of
  sizes, the far ones smaller and fainter. Colours and background come from
  the site's own stylesheet, linked below: the card's grey, .frag-stage's tint,
  the "data" domain's cyan and the orange that serves as amber.

  Deterministic (seeded) and periodic: a frame depends only on a phase from 0
  to 1, and phase 1 draws the same picture as phase 0. Only the air and eight
  lamps move; the racks never do. Where the air runs straight it advances
  exactly one pixel right and one down per frame, so its dots are drawn the
  same in every frame (nothing flickers) and the video stays light. Open it in
  a browser to watch it (add ?theme=dark, or ?phase=0.25 for one still), or
  record it:

    node scripts/loops/record.mjs cooling-agent cooling-agent
-->
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Cooling agent · loop</title>
    <script>
      document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light";
    </script>
    <link rel="stylesheet" href="../../app/globals.css" />
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: var(--card);
      }
      /* the card (its grey, its domain's colour)… */
      #card {
        width: 832px;
        height: 520px;
        background: var(--card);
      }
      /* …and the top of it: .frag-stage paints the tint */
      #stage {
        position: relative;
        width: 832px;
        height: 520px;
      }
      canvas {
        position: absolute;
        inset: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="card" data-domain="data">
      <div id="stage" class="frag-stage"><canvas id="scene" width="832" height="520"></canvas></div>
    </div>
    <script>
      "use strict";

      const LOOP = { width: 832, height: 520, seconds: 7, fps: 24 };
      const W = LOOP.width;
      const H = LOOP.height;
      const TAU = Math.PI * 2;

      /* ------------------------------ helpers ------------------------------ */

      // the same generator and weighted pick as the hero's cloud (lib/chip-cloud.ts)
      function mulberry32(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function pick(rnd, pairs) {
        let r = rnd() * pairs.reduce((s, p) => s + p[1], 0);
        for (const [v, w] of pairs) if ((r -= w) < 0) return v;
        return pairs[pairs.length - 1][0];
      }
      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const smooth = (a, b, x) => {
        const t = clamp01((x - a) / (b - a));
        return t * t * (3 - 2 * t);
      };
      const mix = (a, b, t) => a + (b - a) * t;

      /* ------------------------------- world ------------------------------- */
      // Units: metres, more or less. x is the way the air goes, z runs along the
      // row, y is up. A rack: 0.6 wide (z), 1 deep (x), 2 tall.

      const RACK = { n: 4, pitch: 1.4, w: 0.6, d: 1.0, h: 2.0 };
      const rackZ = (k) => (k - (RACK.n - 1) / 2) * RACK.pitch;

      // Camera: orthographic, `el` above the floor and turned `az` from +x towards
      // +z, so that it sees each rack's top, its door (+x, where the air leaves)
      // and one side (+z). `az` is the turn at which the wind (+x) runs at 45° on
      // screen: with SCALE px to the metre, air that advances STEP metres moves
      // exactly one pixel right and one down. `at` is the point at mid-frame.
      const EL = 0.76;
      const CAM = { el: EL, az: Math.atan(Math.sin(EL)), at: [-0.2, 0.3, 0.0] };
      const SCALE = 83;
      const STEP = 1 / (SCALE * Math.sin(CAM.az));
      const VIEW = (() => {
        const [ca, sa, ce, se] = [Math.cos(CAM.az), Math.sin(CAM.az), Math.cos(CAM.el), Math.sin(CAM.el)];
        // right, up and forward (away from the camera)
        return { r: [sa, 0, -ca], up: [-ca * se, ce, -sa * se], f: [-ce * ca, -se, -ce * sa] };
      })();

      /** How much of the way from p towards the camera goes through a rack other than `own` (metres). */
      function behind(x, y, z, own) {
        const [dx, dy, dz] = [-VIEW.f[0], -VIEW.f[1], -VIEW.f[2]];
        let total = 0;
        for (let k = 0; k < RACK.n; k++) {
          if (k === own) continue;
          const zc = rackZ(k);
          let t0 = 0;
          let t1 = 100;
          // slabs: x in ±d/2, y in 0..h, z in zc ± w/2
          for (const [o, d, lo, hi] of [[x, dx, -RACK.d / 2, RACK.d / 2], [y, dy, 0, RACK.h], [z, dz, zc - RACK.w / 2, zc + RACK.w / 2]]) {
            const a = (lo - o) / d;
            const b = (hi - o) / d;
            t0 = Math.max(t0, Math.min(a, b));
            t1 = Math.min(t1, Math.max(a, b));
          }
          if (t1 > t0) total += t1 - t0;
        }
        return total;
      }

      // Dot diameters in px, at mid-depth: many fine, some medium, a few large
      // (the hero's hierarchy, at this card's size).
      const DOT = { xs: 1.9, s: 2.7, m: 3.9, l: 5.6 };
      const look = (sizes, alphas = [[1, 1]]) => ({ sizes, alphas });
      const EDGE = look([[DOT.s, 0.56], [DOT.m, 0.38], [DOT.l, 0.06]]);
      const EDGE_LOW = look([[DOT.xs, 0.45], [DOT.s, 0.55]]);
      const CORNER = look([[DOT.l, 1]]);
      const FACE = look([[DOT.xs, 0.74], [DOT.s, 0.22], [DOT.m, 0.04]], [[0.6, 0.22], [1, 0.78]]);
      const SLAT = look([[DOT.xs, 0.8], [DOT.s, 0.2]], [[0.6, 0.3], [1, 0.7]]);
      const LAMP = look([[DOT.s, 1]], [[0.75, 1]]);
      const BEAT = look([[DOT.l, 1]]);
      // the air, by how close a line passes to a rack: the two that wrap each rack are the ones to follow
      const AIR = [
        look([[DOT.s, 0.5], [DOT.m, 0.38], [DOT.l, 0.12]]),
        look([[DOT.xs, 0.4], [DOT.s, 0.46], [DOT.m, 0.14]], [[0.8, 0.3], [1, 0.7]]),
        look([[DOT.xs, 0.82], [DOT.s, 0.18]], [[0.55, 0.35], [0.85, 0.65]]),
      ];

      /* ------------------------------- racks ------------------------------- */

      /** Every rack as dots: crisp edges, a fine grain on the faces, slats and lamps on the door. */
      function buildRacks() {
        const rnd = mulberry32(20261112);
        const pitch = 0.05;
        const pts = [];
        let lamps = 0;
        for (let k = 0; k < RACK.n; k++) {
          // (what another rack hides never shows: the camera does not move)
          const add = (x, y, z, lk, lamp = null) => {
            const shown = 1 - smooth(0, 0.1, behind(x, y, z, k));
            const [s, a] = [pick(rnd, lk.sizes), pick(rnd, lk.alphas)];
            if (shown > 0) pts.push({ x, y, z, s, a: a * shown, lamp });
          };
          const line = (a, b, lk, gap = pitch) => {
            const count = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]) / gap));
            for (let i = 0; i < count; i++) {
              const t = (i + 0.5 + (rnd() - 0.5) * 0.3) / count;
              add(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t, lk);
            }
          };
          const zc = rackZ(k);
          const x0 = -RACK.d / 2;
          const x1 = RACK.d / 2;
          const z0 = zc - RACK.w / 2;
          const z1 = zc + RACK.w / 2;
          const h = RACK.h;

          // the nine edges the camera sees: the top's four, three uprights, two on the floor
          line([x0, h, z0], [x1, h, z0], EDGE);
          line([x1, h, z0], [x1, h, z1], EDGE);
          line([x1, h, z1], [x0, h, z1], EDGE);
          line([x0, h, z1], [x0, h, z0], EDGE);
          line([x1, 0, z1], [x1, h, z1], EDGE);
          line([x1, 0, z0], [x1, h, z0], EDGE);
          line([x0, 0, z1], [x0, h, z1], EDGE);
          line([x1, 0, z0], [x1, 0, z1], EDGE_LOW, pitch * 1.25);
          line([x0, 0, z1], [x1, 0, z1], EDGE_LOW, pitch * 1.25);
          for (const [x, z] of [[x0, z0], [x1, z0], [x1, z1], [x0, z1]]) add(x, h, z, CORNER);
          for (const [x, z] of [[x1, z0], [x1, z1], [x0, z1]]) add(x, 0, z, EDGE);

          // a face as a loose grid: regular enough to read as a plane, never ruled
          const grid = (nu, nv, at, lk) => {
            for (let i = 0; i < nu; i++)
              for (let j = 0; j < nv; j++) {
                const [x, y, z] = at((i + 0.5 + (rnd() - 0.5) * 0.7) / nu, (j + 0.5 + (rnd() - 0.5) * 0.7) / nv);
                add(x, y, z, lk);
              }
          };
          const m = 0.07;
          // top
          grid(8, 5, (u, v) => [mix(x0 + m, x1 - m, u), h, mix(z0 + m, z1 - m, v)], FACE);
          // side (+z)
          grid(8, 16, (u, v) => [mix(x0 + m, x1 - m, u), mix(m, h - m, v), z1], FACE);

          // door (+x): the servers, each a slat of fine dots and, apart, its lamp. Two lamps per rack are lit
          // (cyan, one in four amber) and beat slowly, once or twice per loop, each at its own moment.
          const rows = 14;
          const lit = new Set();
          while (lit.size < 2) lit.add(Math.floor(rnd() * (rows - 3)) + 2);
          for (let r = 0; r < rows; r++) {
            const y = mix(0.2, h - 0.2, r / (rows - 1));
            line([x1, y, z0 + 0.09], [x1, y, z1 - 0.2], SLAT, 0.056);
            if (lit.has(r)) add(x1, y, z1 - 0.105, BEAT, { amber: lamps++ % 4 === 1, at: rnd(), beats: 1 + (r % 2) });
            else add(x1, y, z1 - 0.105, LAMP);
          }
        }
        return pts;
      }

      /* -------------------------------- air -------------------------------- */

      /**
       * The air, seen from above, as an ideal flow around the racks: its stream
       * function ψ (constant along each line of air) solves Laplace's equation
       * on a grid, with ψ = z far away (a uniform wind along +x) and ψ fixed on
       * each rack's footprint, slightly grown and rounded so that the lines pass
       * at a small distance. The velocity is (∂ψ/∂z, −∂ψ/∂x).
       */
      const CALM = [2.0, 3.2];
      function solveAir() {
        const step = 0.03;
        const half = 6;
        const n = Math.round((2 * half) / step) + 1;
        const psi = new Float64Array(n * n);
        const fixed = new Uint8Array(n * n);
        const grow = 0.14;
        const round = 0.22;
        const bx = RACK.d / 2 + grow - round;
        const bz = RACK.w / 2 + grow - round;
        for (let j = 0; j < n; j++)
          for (let i = 0; i < n; i++) {
            const x = -half + i * step;
            const z = -half + j * step;
            const id = j * n + i;
            psi[id] = z;
            if (i === 0 || j === 0 || i === n - 1 || j === n - 1) fixed[id] = 1;
            for (let k = 0; k < RACK.n; k++) {
              const qx = Math.max(Math.abs(x) - bx, 0);
              const qz = Math.max(Math.abs(z - rackZ(k)) - bz, 0);
              if (Math.hypot(qx, qz) < round) {
                psi[id] = rackZ(k);
                fixed[id] = 1;
              }
            }
          }
        // successive over-relaxation, a fixed number of sweeps (deterministic)
        const omega = 2 / (1 + Math.sin(Math.PI / n));
        for (let sweep = 0; sweep < 900; sweep++)
          for (let j = 1; j < n - 1; j++)
            for (let i = 1, id = j * n + 1; i < n - 1; i++, id++) {
              if (fixed[id]) continue;
              psi[id] += omega * (0.25 * (psi[id - 1] + psi[id + 1] + psi[id - n] + psi[id + n]) - psi[id]);
            }
        // Away from the row the racks' pull on the air dies out slowly; fade it
        // out altogether between CALM[0] and CALM[1] metres, so that out there
        // the wind is exactly uniform (still a stream function: nothing piles up).
        for (let j = 0; j < n; j++)
          for (let i = 0; i < n; i++) {
            const z = -half + j * step;
            const keep = 1 - smooth(CALM[0], CALM[1], Math.abs(-half + i * step));
            psi[j * n + i] = z + (psi[j * n + i] - z) * keep;
          }
        // velocity at the nodes (central differences), read bilinearly
        const u = new Float32Array(n * n);
        const w = new Float32Array(n * n);
        for (let j = 1; j < n - 1; j++)
          for (let i = 1; i < n - 1; i++) {
            const id = j * n + i;
            u[id] = (psi[id + n] - psi[id - n]) / (2 * step);
            w[id] = -(psi[id + 1] - psi[id - 1]) / (2 * step);
          }
        return (x, z) => {
          const fx = clamp01((x + half) / (2 * half)) * (n - 1.001);
          const fz = clamp01((z + half) / (2 * half)) * (n - 1.001);
          const i = Math.floor(fx);
          const j = Math.floor(fz);
          const tx = fx - i;
          const tz = fz - j;
          const id = j * n + i;
          const a = (1 - tx) * (1 - tz);
          const b = tx * (1 - tz);
          const c = (1 - tx) * tz;
          const d = tx * tz;
          return [u[id] * a + u[id + 1] * b + u[id + n] * c + u[id + n + 1] * d, w[id] * a + w[id + 1] * b + w[id + n] * c + w[id + n + 1] * d];
        };
      }

      const AIR_X = [-3.4, 3.0]; // where the lines start and end
      const AIR_DT = 0.004;
      /** 1: the puffs keep the air's true pace (slow before a rack, fast in the gaps); 0: an even pace. In between, a softer version of the true one. */
      const PACE = 0.45;

      /** One line of air from (AIR_X[0], z): where a puff is after each AIR_DT of its own time (far from the racks, a metre of time is a metre of way). */
      function traceLine(vel, zStart) {
        const path = [AIR_X[0], zStart];
        let x = AIR_X[0];
        let z = zStart;
        const pace = (px, pz) => {
          const [u, w] = vel(px, pz);
          const k = Math.max(1e-3, Math.hypot(u, w)) ** (PACE - 1);
          return [u * k, w * k];
        };
        for (let guard = 0; guard < 20000 && x < AIR_X[1]; guard++) {
          const [u1, w1] = pace(x, z);
          const [u2, w2] = pace(x + (u1 * AIR_DT) / 2, z + (w1 * AIR_DT) / 2);
          const [u3, w3] = pace(x + (u2 * AIR_DT) / 2, z + (w2 * AIR_DT) / 2);
          const [u4, w4] = pace(x + u3 * AIR_DT, z + w3 * AIR_DT);
          x += ((u1 + 2 * u2 + 2 * u3 + u4) * AIR_DT) / 6;
          z += ((w1 + 2 * w2 + 2 * w3 + w4) * AIR_DT) / 6;
          path.push(x, z);
        }
        return { path: new Float64Array(path), time: (path.length / 2 - 1) * AIR_DT };
      }

      // A sheet of air at this height: a rake of lines, RAKE apart (none on a
      // rack's axis: that line would stop at its door), two past each end of
      // the row.
      const AIR_Y = 0.5;
      const RAKE = RACK.pitch / 8;
      // In one loop the air advances LAP (one pixel right and one down per
      // frame, where it runs straight). Each line is a stream of puffs that
      // repeats every LAP, so the last frame hands over to the first.
      const LAP = STEP * LOOP.seconds * LOOP.fps;
      const PUFFS = 34; // per LAP

      function buildAir() {
        const vel = solveAir();
        const count = Math.round((RACK.n * RACK.pitch) / RAKE) + 4;
        const lines = Array.from({ length: count }, (_, i) => traceLine(vel, (i - (count - 1) / 2) * RAKE));
        const rnd = mulberry32(977);
        const puffs = [];
        lines.forEach((ln, li) => {
          const off = Math.min(...Array.from({ length: RACK.n }, (_, k) => Math.abs(ln.path[1] - rackZ(k))));
          const lk = AIR[off < RAKE ? 0 : off < 2 * RAKE ? 1 : 2];
          for (let j = 0; j < PUFFS; j++) {
            const u = (j + 0.5 + (rnd() - 0.5) * 0.5) / PUFFS;
            // the air breathes: once per LAP its puffs come a little larger and fuller, a band that travels with them
            // (in the first frame, the poster, one band is about to reach the racks and another has just left them)
            const breath = 0.5 - 0.5 * Math.cos(TAU * u);
            const p = { line: li, u, s: pick(rnd, lk.sizes) * mix(0.9, 1.1, breath), a: pick(rnd, lk.alphas) * mix(0.74, 1, breath), turn: mix(-0.1, 0.9, rnd()), dy: (rnd() - 0.5) * 0.03 };
            // the same puff once per LAP of the line
            for (let lap = -1; (lap + p.u) * LAP < ln.time; lap++) puffs.push({ ...p, lap });
          }
        });
        return { lines, puffs };
      }

      /* ------------------------------ drawing ------------------------------ */

      const racks = buildRacks();
      const air = buildAir();
      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");

      // sRGB ↔ OKLab, to go from amber to cyan without the mud of a plain mix
      const toLinear = (c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
      const toSRGB = (c) => (c <= 0.0031308 ? c * 12.92 : 1.055 * c ** (1 / 2.4) - 0.055);
      function oklab([r, g, b]) {
        const [R, G, B] = [r, g, b].map((v) => toLinear(v / 255));
        const l = Math.cbrt(0.4122214708 * R + 0.5363325363 * G + 0.0514459929 * B);
        const m = Math.cbrt(0.2119034982 * R + 0.6806995451 * G + 0.1073969566 * B);
        const s = Math.cbrt(0.0883024619 * R + 0.2817188376 * G + 0.6299787005 * B);
        return [0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s, 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s];
      }
      function srgb([L, a, b]) {
        const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
        const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
        const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
        return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s].map((v) => Math.round(clamp01(toSRGB(clamp01(v))) * 255));
      }

      // The card's colours, from the site's stylesheet. Ink: the page's text colour (#1D1D1F; in the dark, #F5F5F7
      // at 85 %, like the hero's cloud, and the air is held back as much). Amber: the site's orange. Cyan: the card's domain.
      const pal = (() => {
        const css = getComputedStyle(document.getElementById("card"));
        const rgb = (name) => css.getPropertyValue(name).trim().split(/\s+/).map(Number);
        const dark = document.documentElement.dataset.theme === "dark";
        const [ink, amber, cyan] = [rgb("--fg-rgb"), rgb("--orange-rgb"), rgb("--d-rgb")];
        if (![...ink, ...amber, ...cyan].every(Number.isFinite) || ink.length + amber.length + cyan.length !== 9) throw new Error("no colours: app/globals.css did not load, or its tokens changed");
        const [a, b] = [oklab(amber), oklab(cyan)];
        // amber → cyan in 33 steps
        const ramp = Array.from({ length: 33 }, (_, i) => srgb([0, 1, 2].map((c) => mix(a[c], b[c], i / 32))).join(" "));
        return { ink: ink.join(" "), inkAlpha: dark ? 0.85 : 1, airAlpha: dark ? 0.85 : 1, ramp, amber: amber.join(" "), cyan: cyan.join(" ") };
      })();

      function draw(phase) {

        const dots = [];
        const put = (x, y, z, size, alpha, colour) => {
          const [dx, dy, dz] = [x - CAM.at[0], y - CAM.at[1], z - CAM.at[2]];
          const depth = dx * VIEW.f[0] + dy * VIEW.f[1] + dz * VIEW.f[2];
          // further away: smaller and fainter
          const far = smooth(-2.8, 3.2, depth);
          dots.push({ sx: W / 2 + SCALE * (dx * VIEW.r[0] + dy * VIEW.r[1] + dz * VIEW.r[2]), sy: H / 2 - SCALE * (dx * VIEW.up[0] + dy * VIEW.up[1] + dz * VIEW.up[2]), r: (size * mix(1.1, 0.84, far)) / 2, alpha: alpha * mix(1, 0.55, far), colour, depth });
        };

        for (const p of racks) {
          if (p.lamp) {
            const beat = 0.5 - 0.5 * Math.cos(TAU * (p.lamp.beats * phase + p.lamp.at));
            put(p.x, p.y, p.z, p.s * (0.75 + 0.4 * beat), p.a * (0.35 + 0.65 * beat), p.lamp.amber ? pal.amber : pal.cyan);
          } else put(p.x, p.y, p.z, p.s, p.a * pal.inkAlpha, pal.ink);
        }

        for (const p of air.puffs) {
          const ln = air.lines[p.line];
          const t = (p.lap + p.u + phase) * LAP;
          if (t <= 0 || t >= ln.time) continue;
          const f = t / AIR_DT;
          const i = Math.min(ln.path.length / 2 - 2, Math.floor(f));
          const x = mix(ln.path[i * 2], ln.path[i * 2 + 2], f - i);
          const z = mix(ln.path[i * 2 + 1], ln.path[i * 2 + 3], f - i);
          const y = AIR_Y + p.dy;
          // it comes in and goes out little by little
          const ends = smooth(0, 1.0, t) * (1 - smooth(ln.time - 1.1, ln.time, t));
          const seen = 1 - 0.9 * smooth(0, 0.12, behind(x, y, z, -1));
          // amber on the way in, cyan on the way out; each puff turns, quickly, at its own point among the racks
          const cool = smooth(-0.12, 0.12, x - p.turn);
          put(x, y, z, p.s, p.a * pal.airAlpha * ends * seen, pal.ramp[Math.round(cool * 32)]);
        }

        dots.sort((a, b) => b.depth - a.depth);
        ctx.clearRect(0, 0, W, H);
        for (const d of dots) {
          if (d.alpha <= 0.004) continue;
          ctx.fillStyle = `rgb(${d.colour} / ${d.alpha.toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(d.sx, d.sy, d.r, 0, TAU);
          ctx.fill();
        }
      }

      // What the recorder uses: the clip's size and length, and one frame at a phase.
      window.loop = { ...LOOP, draw };

      const still = new URLSearchParams(location.search).get("phase");
      if (still !== null) draw(Number(still));
      else if (!navigator.webdriver) {
        const from = performance.now();
        const tick = (now) => {
          draw((((now - from) / 1000 / LOOP.seconds) % 1 + 1) % 1);
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      } else draw(0);
    </script>
  </body>
</html>
