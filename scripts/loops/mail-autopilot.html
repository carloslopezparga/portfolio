<!doctype html>
<!--
  The looping clip at the top of the "Email on autopilot" card, as a canvas scene:
  from noise to digest. Small envelopes drawn with dots arrive from the left, each
  at its own pace, and converge on a ring that beats slowly in the card's accent;
  as it enters, each envelope breaks into dust. Out of the ring, to the right,
  comes one sheet: its dotted lines are written top to bottom, in three groups,
  and it leaves to make room for the next.

  The look is the hero chip's (lib/chip-cloud.ts): crisp dots in a hierarchy of
  sizes, some depth (far: smaller and fainter) and one accent colour.

  Everything is a function of one phase, 0 to 1, and is seeded: the same phase
  always draws the same frame, and phase 1 is phase 0, so the clip loops without a
  seam. Open this file in a browser to watch it (add ?dark for the dark theme);
  `node scripts/loops/record.mjs mail-autopilot` records it frame by frame.

  The background is not drawn here: it is the card's own, painted by the site's
  stylesheet (the card's colour, and over it .frag-stage's tint in the card's
  domain colour). Ink and accent are read from the same tokens.
-->
<html lang="en" class="js" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Email on autopilot · card loop</title>
    <!-- the site's tokens and .frag-stage (a browser skips the Tailwind at-rules in it) -->
    <link rel="stylesheet" href="../../app/globals.css" />
    <style>
      html,
      body {
        margin: 0;
      }
      body {
        display: block;
        min-height: 0;
      }
      /* the project card (.card: its background) and the top of it (.frag-stage: the tint) */
      #card {
        width: 832px;
        background: var(--card);
      }
      #stage {
        width: 832px;
        height: 520px;
      }
      #stage canvas {
        display: block;
        width: 832px;
        height: 520px;
      }
    </style>
  </head>
  <body>
    <!-- data-domain: the project's domain in content/profile.ts (its accent) -->
    <div id="card" data-domain="ai">
      <div id="stage" class="frag-stage"><canvas id="scene" width="832" height="520"></canvas></div>
    </div>
    <script>
      "use strict";

      const W = 832;
      const H = 520;
      /** The clip's length: only to turn the phase into seconds where a speed matters. */
      const SECONDS = 7;
      const TAU = Math.PI * 2;

      const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
      const mix = (a, b, t) => a + (b - a) * t;
      const frac = (v) => v - Math.floor(v);
      const smooth = (a, b, v) => {
        const t = clamp((v - a) / (b - a), 0, 1);
        return t * t * (3 - 2 * t);
      };
      const smoother = (t) => t * t * t * (t * (t * 6 - 15) + 10);

      /* ---------------- seeded randomness (as lib/chip-cloud.ts) ---------------- */
      function mulberry32(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function pick(rnd, pairs) {
        let r = rnd() * pairs.reduce((s, p) => s + p[1], 0);
        for (const [v, w] of pairs) if ((r -= w) < 0) return v;
        return pairs[pairs.length - 1][0];
      }
      const gauss = (rnd) => (rnd() + rnd() + rnd() + rnd() - 2) * 0.87;

      /*
       * Dot diameters in the clip's pixels: many tiny, some medium, a few large.
       * The card shows the clip at 0.625× (520 px wide), where these are the
       * hero's sizes a step down, as its objects are several times smaller.
       */
      const DOT = { xs: 2.2, s: 3.2, m: 4.8, l: 7 };
      const look = (sizes, alphas = [[1, 1]]) => ({ sizes, alphas });
      const EDGE = look([[DOT.s, 0.74], [DOT.m, 0.26]]);
      const FINE = look([[DOT.xs, 0.55], [DOT.s, 0.45]]);
      const GRAIN = look([[DOT.xs, 0.6], [DOT.s, 0.28], [DOT.m, 0.1], [DOT.l, 0.02]], [[0.6, 0.4], [1, 0.6]]);
      const BEADS = look([[DOT.xs, 0.4], [DOT.s, 0.36], [DOT.m, 0.2], [DOT.l, 0.04]], [[0.6, 0.25], [1, 0.75]]);

      /* ---------------- the frame's dots ---------------- */
      // x, y, diameter, opacity, accent (0 ink … 1 accent)
      const dots = new Float32Array(5 * 6000);
      let count = 0;
      function dot(x, y, d, a, t) {
        if (a <= 0.004 || d <= 0.05) return;
        // a dot under a pixel wide keeps its width and fades instead, so it never flickers
        if (d < 1.3) {
          a *= (d / 1.3) * (d / 1.3);
          d = 1.3;
        }
        dots.set([x, y, d, a, t], count * 5);
        count++;
      }

      /**
       * Where a point of a flat thing lands: its own x, y (and z, out of its plane),
       * turned by roll, then yaw, then pitch, scaled and seen in perspective from
       * `focal` px. Returns the screen position and how much nearer (> 1) or
       * farther (< 1) than its centre the point is.
       */
      const seen = { x: 0, y: 0, k: 1 };
      function place(pose, lx, ly, lz) {
        const x0 = lx * pose.cr - ly * pose.sr;
        const y0 = lx * pose.sr + ly * pose.cr;
        const x1 = x0 * pose.cy + lz * pose.sy;
        const z1 = -x0 * pose.sy + lz * pose.cy;
        const y2 = y0 * pose.cp - z1 * pose.sp;
        const z2 = y0 * pose.sp + z1 * pose.cp;
        const k = pose.focal / (pose.focal + z2 * pose.s);
        seen.x = pose.x + x1 * pose.s * k;
        seen.y = pose.y + y2 * pose.s * k;
        seen.k = k;
        return seen;
      }
      function turn(pose, roll, yaw, pitch) {
        pose.cr = Math.cos(roll);
        pose.sr = Math.sin(roll);
        pose.cy = Math.cos(yaw);
        pose.sy = Math.sin(yaw);
        pose.cp = Math.cos(pitch);
        pose.sp = Math.sin(pitch);
        return pose;
      }
      const newPose = (focal) => ({ x: 0, y: 0, s: 1, focal, cr: 1, sr: 0, cy: 1, sy: 0, cp: 1, sp: 0 });
      /** Depth, exaggerated a little: what is farther is smaller and fainter than perspective alone makes it. */
      const nearer = (k) => clamp(1 + (k - 1) * 3.2, 0.45, 1.5);

      /* ---------------- the ring ---------------- */
      // a flat band, as one of the chip's slabs: two crisp rims and, between them, a grain of beads
      const RING = { x: 416, y: 260, inner: 54, outer: 83, focal: 640 };
      const MID = (RING.inner + RING.outer) / 2;
      /** Envelopes break up around this radius (in the ring's plane), before they reach the ring: each dot a little sooner or later. */
      const BREAK = RING.outer + 30;
      const BREAK_SPREAD = 26;
      /*
       * The beat, in shares of the loop: every `every`, the accent sweeps into the ring from the left (`rise`), fills
       * it (`hold`) and drains out to the right (`fall`); the ring is full at `full`, as the sheet starts to come out.
       * A bead takes the accent, and gives it back, in `turn` (three frames): quick changes of colour survive the
       * clip's compression, slow fades do not.
       */
      const BEAT = { every: 0.5, full: 0.235, rise: 0.1, hold: 0.1, fall: 0.3, turn: 0.018 };
      /** How much of the accent a bead at `across` (0 the ring's left … 1 its right) has at this phase. */
      function glow(phase, across) {
        const t = frac((phase - (BEAT.full - BEAT.rise)) / BEAT.every) * BEAT.every;
        const on = across * BEAT.rise;
        const off = BEAT.rise + BEAT.hold + across * BEAT.fall;
        const lit = (at) => smooth(0, BEAT.turn, at - on) * (1 - smooth(0, BEAT.turn, at - off));
        // (the wave before this one may still be draining on the right)
        return Math.max(lit(t), lit(t + BEAT.every));
      }
      // Tipped back: the top is the far side. Its dots hold still, and what holds still stays sharp in the clip: it is its colour that moves.
      const ringPose = turn(newPose(RING.focal), 0, 0, 0.42);
      ringPose.x = RING.x;
      ringPose.y = RING.y;
      /** A screen point back to the ring's plane (exact inverse of place() for z = 0, no roll). */
      const flat = { u: 0, v: 0 };
      function toRing(pose, sx, sy) {
        const dx = (sx - pose.x) / pose.s;
        const dy = (sy - pose.y) / pose.s;
        const F = pose.focal / pose.s;
        const a = -dx * pose.sy - F * pose.cy;
        const b = dx * pose.sp * pose.cy - F * pose.sp * pose.sy;
        const c = -dy * pose.sy;
        const d = dy * pose.sp * pose.cy - F * pose.cp;
        const det = a * d - b * c;
        flat.u = (-dx * F * d + b * dy * F) / det;
        flat.v = (-a * dy * F + c * dx * F) / det;
        return flat;
      }

      /*
       * The ring's dots: two rims in ink, evenly spaced, and between them beads on
       * three tracks, loosely spaced (regular enough to read as a face, never
       * ruled). The beads carry the beat: each takes the accent when the wave
       * reaches it (`across`, its place from left to right, a little shuffled so
       * the wave's front is not a line). `lit` is set on the dots that never
       * change: 0 the rims, 1 the few beads that always keep the accent.
       */
      const TRACKS = [RING.inner + 7, MID, RING.outer - 7];
      const ringDots = [];
      {
        const rnd = mulberry32(20261112);
        for (const [r, n] of [[RING.outer, 96], [RING.inner, 63]]) {
          for (let i = 0; i < n; i++) ringDots.push({ x: r * Math.cos((i / n) * TAU), y: r * Math.sin((i / n) * TAU), w: 0, d: i % 8 === 0 ? DOT.m : DOT.s, a: 1, lit: 0 });
        }
        for (const radius of TRACKS) {
          const n = Math.round((TAU * radius) / 7.6);
          for (let i = 0; i < n; i++) {
            const th = ((i + 0.5 + (rnd() - 0.5) * 0.5) / n) * TAU;
            const r = radius + (rnd() - 0.5) * 2.4;
            const across = clamp(0.82 * (0.5 + (0.5 * r * Math.cos(th)) / RING.outer) + 0.18 * rnd(), 0, 1);
            ringDots.push({ x: r * Math.cos(th), y: r * Math.sin(th), w: gauss(rnd) * 3, d: pick(rnd, BEADS.sizes), a: pick(rnd, BEADS.alphas), across, lit: rnd() < 0.12 ? 1 : null });
          }
        }
        for (const p of ringDots) {
          const at = place(ringPose, p.x, p.y, p.w);
          const n = nearer(at.k);
          p.sx = at.x;
          p.sy = at.y;
          p.d *= n;
          p.a *= clamp(n, 0.5, 1);
        }
      }
      function drawRing(phase) {
        for (const p of ringDots) {
          const lit = p.lit ?? glow(phase, p.across);
          dot(p.sx, p.sy, p.d * (1 + 0.2 * lit), p.a, lit);
        }
      }

      /* ---------------- what arrives: envelopes and loose specks ---------------- */
      function envelopeDots(rnd) {
        const w = 34;
        const h = 23.5;
        const tip = 6; // the flap's point, below the middle
        const out = [];
        const line = (ax, ay, bx, by, pitch, lk) => {
          const n = Math.max(1, Math.round(Math.hypot(bx - ax, by - ay) / pitch));
          for (let i = 1; i < n; i++) {
            const t = (i + (rnd() - 0.5) * 0.24) / n;
            out.push({ x: mix(ax, bx, t), y: mix(ay, by, t), d: pick(rnd, lk.sizes), a: pick(rnd, lk.alphas) });
          }
        };
        for (const [x, y] of [[-w, -h], [w, -h], [w, h], [-w, h]]) out.push({ x, y, d: DOT.l, a: 1 });
        line(-w, -h, w, -h, 5.1, EDGE);
        line(w, -h, w, h, 5.1, EDGE);
        line(w, h, -w, h, 5.1, EDGE);
        line(-w, h, -w, -h, 5.1, EDGE);
        line(-w, -h, 0, tip, 4.9, FINE);
        line(w, -h, 0, tip, 4.9, FINE);
        out.push({ x: 0, y: tip, d: DOT.m, a: 1 });
        return out;
      }

      /**
       * One arrival: a curve from beyond the left edge to the ring's centre, flown
       * once per loop. `at` is when it sets off (phase), `span` how long the flight
       * takes (as a share of the loop), `far` its depth (0 near … 1 far). Which
       * side each comes from and how far it is go by the golden ratio, so
       * neighbours in time are apart in space (`sides` and `depths` shift the two series).
       */
      function flight(rnd, order, total, shape) {
        const golden = 0.6180339887;
        const side = frac(order * golden + shape.sides) * 2 - 1; // −1 from above … 1 from below
        const beta = side * shape.fan; // the angle it comes in at
        const far = frac(order * golden * golden + shape.depths);
        const span = shape.span[0] + (shape.span[1] - shape.span[0]) * rnd();
        const lands = (order + 0.5 + (rnd() - 0.5) * shape.jitter) / total;
        const y0 = RING.y + Math.sin(beta * 1.12) * shape.reach + (rnd() - 0.5) * 36;
        const x0 = -64 - 40 * rnd();
        return {
          far,
          span,
          at: frac(lands - span),
          p: [x0, y0, x0 + 190 + 60 * rnd(), y0 + (rnd() - 0.5) * 70, RING.x - 185 * Math.cos(beta), RING.y + 185 * Math.sin(beta), RING.x, RING.y],
          s: mix(shape.scale[0], shape.scale[1], far),
          alpha: mix(shape.alpha[0], shape.alpha[1], far),
          wob: [rnd(), rnd(), rnd()],
          dots: shape.dots(rnd),
        };
      }
      const curve = { x: 0, y: 0, tx: 0, ty: 0 };
      function along(p, q) {
        const m = 1 - q;
        curve.x = m * m * m * p[0] + 3 * m * m * q * p[2] + 3 * m * q * q * p[4] + q * q * q * p[6];
        curve.y = m * m * m * p[1] + 3 * m * m * q * p[3] + 3 * m * q * q * p[5] + q * q * q * p[7];
        curve.tx = 3 * m * m * (p[2] - p[0]) + 6 * m * q * (p[4] - p[2]) + 3 * q * q * (p[6] - p[4]);
        curve.ty = 3 * m * m * (p[3] - p[1]) + 6 * m * q * (p[5] - p[3]) + 3 * q * q * (p[7] - p[5]);
        return curve;
      }
      const flyPose = newPose(380);
      /** An arrival's pose at q (0 setting off … 1 at the ring's centre): it tumbles slowly and shrinks a little as it is drawn in. */
      function setFlight(f, q) {
        const phase = f.at + q * f.span;
        const c = along(f.p, q);
        flyPose.x = c.x;
        flyPose.y = c.y;
        flyPose.s = f.s * (1 - 0.2 * smooth(0.55, 1, q));
        const roll = 0.42 * Math.atan2(c.ty, c.tx) + 0.1 * Math.sin(TAU * (phase + f.wob[2]));
        return turn(flyPose, roll, 0.5 * Math.sin(TAU * (phase + f.wob[0])), -0.08 + 0.3 * Math.sin(TAU * (phase + f.wob[1])));
      }

      const ENVELOPES = { sides: 0.13, depths: 0.31, fan: 0.74, reach: 232, span: [0.44, 0.72], jitter: 0.5, scale: [1.06, 0.54], alpha: [1, 0.44], dots: envelopeDots };
      const SPECKS = { sides: 0.57, depths: 0.83, fan: 0.95, reach: 250, span: [0.34, 0.7], jitter: 1, scale: [1.05, 0.6], alpha: [0.9, 0.4], dots: (rnd) => [{ x: 0, y: 0, d: pick(rnd, GRAIN.sizes), a: pick(rnd, GRAIN.alphas) }] };
      const flights = [];
      {
        const rnd = mulberry32(7002);
        for (let i = 0; i < 13; i++) flights.push(flight(rnd, i, 13, ENVELOPES));
        const rnd2 = mulberry32(4711);
        for (let i = 0; i < 48; i++) flights.push(flight(rnd2, i, 48, SPECKS));
        // far ones first, so the near ones are drawn over them
        flights.sort((a, b) => b.far - a.far);

        // When each dot breaks off, and how its dust then goes: found once, by flying every arrival.
        const dust = mulberry32(99);
        const STEPS = 480;
        for (const f of flights) {
          for (const p of f.dots) {
            const edge = BREAK + (dust() - 0.5) * BREAK_SPREAD;
            const radius = (q) => {
              const at = place(setFlight(f, q), p.x, p.y, 0);
              const sx = at.x;
              const sy = at.y;
              const uv = toRing(ringPose, sx, sy);
              return Math.hypot(uv.u, uv.v);
            };
            let lo = 0;
            let hi = 1;
            for (let i = 1; i <= STEPS; i++) {
              if (radius(i / STEPS) < edge) {
                lo = (i - 1) / STEPS;
                hi = i / STEPS;
                break;
              }
            }
            for (let i = 0; i < 14; i++) {
              const mid = (lo + hi) / 2;
              if (radius(mid) < edge) hi = mid;
              else lo = mid;
            }
            p.q = hi;
            const at = place(setFlight(f, hi), p.x, p.y, 0);
            const k = at.k;
            const uv = toRing(ringPose, at.x, at.y);
            p.r0 = Math.hypot(uv.u, uv.v);
            p.th0 = Math.atan2(uv.v, uv.u);
            p.k0 = k;
            p.s0 = flyPose.s;
            // dust: it scatters, spirals into the ring's band taking the accent, and is gone
            p.life = 1.05 + 0.7 * dust(); // seconds
            p.rt = TRACKS[Math.floor(dust() * 3)] + (dust() - 0.5) * 6;
            p.swirl = 0.55 + 1.25 * dust();
            p.w = gauss(dust) * 4;
            const heading = dust() * TAU;
            const stray = 5 + 11 * dust();
            p.su = Math.cos(heading) * stray;
            p.sv = Math.sin(heading) * stray;
            // it keeps the speed it came in at, and slows as it settles
            const speed = (radius(hi - 0.004) - radius(hi)) / (0.004 * f.span * SECONDS);
            p.drag = clamp((speed * p.life) / Math.max(4, p.r0 - p.rt), 1.6, 7);
          }
        }
      }
      function drawFlights(phase) {
        const ring = ringPose;
        for (const f of flights) {
          const q = frac(phase - f.at) / f.span;
          const pose = q <= 1 ? setFlight(f, q) : null;
          for (const p of f.dots) {
            if (q < p.q) {
              const at = place(pose, p.x, p.y, 0);
              dot(at.x, at.y, p.d * pose.s * nearer(at.k), p.a * f.alpha, 0);
              continue;
            }
            const x = ((q - p.q) * f.span * SECONDS) / p.life;
            if (x >= 1) continue;
            const r = p.rt + (p.r0 - p.rt) * Math.pow(1 - x, p.drag);
            const th = p.th0 + p.swirl * smoother(x);
            const stray = Math.sin(Math.PI * Math.pow(x, 0.7));
            const at = place(ring, r * Math.cos(th) + p.su * stray, r * Math.sin(th) + p.sv * stray, p.w * x);
            // from the envelope's own depth to the ring's
            const n = mix(nearer(p.k0), nearer(at.k), smooth(0, 0.6, x));
            const size = p.d * mix(p.s0, 0.6, smooth(0, 0.9, x)) * n;
            dot(at.x, at.y, size, p.a * mix(f.alpha, 1, smooth(0, 0.5, x)) * (1 - smooth(0.62, 1, x)), smooth(0.05, 0.6, x));
          }
        }
      }

      /* ---------------- the sheet ---------------- */
      const SHEET = { x: 648, y: 260, w: 88, h: 118, ear: 28, focal: 640 };
      /** Where the sheet is in its own cycle at phase 0: written and at rest (the clip's first frame is its poster). */
      const SHEET_AT = 0.8;
      /**
       * The sheet's cycle: it comes out of the ring (0 to OUT), its lines are written, it rests, and it leaves (LEAVE
       * to GONE). It is gone a little after 1, while the next one is still inside the ring: there is always one sheet.
       */
      const OUT = 0.25;
      const WRITE = [0.235, 0.7];
      const LEAVE = 0.9;
      const GONE = 1.07;
      const sheetDots = [];
      {
        const rnd = mulberry32(31);
        const { w, h, ear } = SHEET;
        const edge = (ax, ay, bx, by, pitch, lk) => {
          const n = Math.max(1, Math.round(Math.hypot(bx - ax, by - ay) / pitch));
          for (let i = 1; i < n; i++) {
            const t = (i + (rnd() - 0.5) * 0.14) / n;
            sheetDots.push({ x: mix(ax, bx, t), y: mix(ay, by, t), d: pick(rnd, lk.sizes), a: 1, at: -1, lit: 0 });
          }
        };
        // the page, its top right corner folded
        for (const [x, y, d] of [[-w, -h, DOT.l], [w, h, DOT.l], [-w, h, DOT.l], [w - ear, -h, DOT.m], [w, -h + ear, DOT.m], [w - ear, -h + ear, DOT.s]]) sheetDots.push({ x, y, d, a: 1, at: -1, lit: 0 });
        edge(-w, -h, w - ear, -h, 5.6, EDGE);
        edge(w - ear, -h, w, -h + ear, 5.2, EDGE);
        edge(w, -h + ear, w, h, 5.6, EDGE);
        edge(w, h, -w, h, 5.6, EDGE);
        edge(-w, h, -w, -h, 5.6, EDGE);
        edge(w - ear, -h, w - ear, -h + ear, 5, FINE);
        edge(w - ear, -h + ear, w, -h + ear, 5, FINE);

        // its text: three groups, each a bullet in the accent, a short heading and two lines
        const left = -w + 20;
        const LINES = [[7, 20, 14], [6, 19, 16], [8, 21, 11]];
        let cost = 0;
        const written = [];
        LINES.forEach(([head, one, two], g) => {
          const y = -h + 37 + g * 67;
          written.push({ x: left + 1, y, d: DOT.l, a: 1, at: cost, lit: 1 });
          cost += 5;
          for (let i = 0; i < head; i++) written.push({ x: left + 16 + i * 7.3, y, d: DOT.m, a: 1, at: cost++, lit: 0 });
          [one, two].forEach((n, row) => {
            cost += 5;
            for (let i = 0; i < n; i++) written.push({ x: left + i * 6.5, y: y + 17.5 + row * 15.5, d: DOT.s, a: 0.82, at: cost++, lit: 0 });
          });
          cost += 16;
        });
        cost -= 16;
        for (const p of written) p.at = mix(WRITE[0], WRITE[1], p.at / cost);
        sheetDots.push(...written);
      }
      {
        const rnd = mulberry32(58);
        for (const p of sheetDots) {
          // the right edge leads and the left one trails: on its way out the page stretches, it does not scatter
          p.lag = 0.86 * (1 - (p.x + SHEET.w) / (2 * SHEET.w)) + 0.14 * rnd();
        }
      }
      /** How much of the way out is spent waiting for the last dots. */
      const LAG = 0.1;
      const bornPose = newPose(SHEET.focal);
      const sheetPose = newPose(SHEET.focal);
      function drawSheet(phase) {
        const u = frac(phase + SHEET_AT);
        sheetAt(u);
        // the one before it, on its way out
        if (u + 1 < GONE) sheetAt(u + 1);
      }
      function sheetAt(u) {
        const gone = smoother(clamp((u - LEAVE) / (GONE - LEAVE), 0, 1));
        const pose = sheetPose;
        pose.x = SHEET.x + 66 * gone;
        pose.y = SHEET.y - 6 * gone;
        pose.s = 1 - 0.06 * gone;
        // turned so that its left edge, the ring's side, is the far one; at rest it holds still
        turn(pose, 0, 0.36 + 0.16 * gone, 0.1);
        const fade = 1 - smooth(0.08, 0.9, gone);

        // coming out: it is born in the ring's hole, small, edge on and in the accent, and opens as it glides to its place
        const coming = u < OUT;
        if (coming) {
          bornPose.x = RING.x;
          bornPose.y = RING.y;
          bornPose.s = 0.2;
          turn(bornPose, 0, 1.15, 0.1);
        }
        for (const p of sheetDots) {
          // written: a dot is there or it is not, as typed (no fading in: what fades slowly, the clip's compression leaves half done)
          if (p.at >= 0 && u < p.at) continue;
          const at = place(pose, p.x, p.y, 0);
          let x = at.x;
          let y = at.y;
          let a = p.a * fade;
          let size = nearer(at.k) * pose.s;
          let lit = p.lit;
          if (coming) {
            const e = smoother(clamp((u / OUT) * (1 + LAG) - p.lag * LAG, 0, 1));
            const from = place(bornPose, p.x, p.y, 0);
            x = mix(from.x, x, e);
            y = mix(from.y, y, e);
            size *= mix(0.42, 1, e);
            a *= smooth(0.02, 0.22, e);
            lit = Math.max(lit, 1 - smooth(0.4, 0.94, e));
          }
          dot(x, y, p.d * size, a, lit);
        }
      }

      /* ---------------- drawing ---------------- */
      const ctx = document.getElementById("scene").getContext("2d");
      const card = document.getElementById("card");
      /** Ink opacity per theme, as the hero's: light dots on a dark card read bolder. */
      const INK_ALPHA = { light: 1, dark: 0.85 };
      const palettes = {};
      function palette() {
        const theme = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
        if (!palettes[theme]) {
          const style = getComputedStyle(card);
          const rgb = (name) => style.getPropertyValue(name).trim().split(/\s+/).map(Number);
          const ink = rgb("--fg-rgb");
          const accent = rgb("--d-rgb");
          if (ink.length !== 3 || accent.length !== 3 || [...ink, ...accent].some(Number.isNaN)) throw new Error("app/globals.css did not load: no --fg-rgb or --d-rgb");
          palettes[theme] = { ink, accent, alpha: INK_ALPHA[theme] };
        }
        return palettes[theme];
      }
      /*
       * The dots are painted here, pixel by pixel, the way the hero's shader paints
       * its own (DOT_FRAG): a disc whose edge fades over one pixel, by distance.
       * A canvas arc would do, but its antialiasing moves in steps, and a small dot
       * that drifts slowly would flicker; this way it glides.
       */
      const paint = new Float32Array(W * H * 4); // red, green, blue (times alpha) and alpha, 0 to 1
      const image = ctx.createImageData(W, H);
      function render(phase) {
        const pal = palette();
        phase = frac(phase);
        count = 0;
        drawFlights(phase);
        drawRing(phase);
        drawSheet(phase);

        paint.fill(0);
        for (let i = 0; i < count; i++) {
          const o = i * 5;
          const x = dots[o];
          const y = dots[o + 1];
          const radius = dots[o + 2] / 2;
          const t = clamp(dots[o + 4], 0, 1);
          const alpha = clamp(dots[o + 3], 0, 1) * mix(pal.alpha, 1, t);
          const r = mix(pal.ink[0], pal.accent[0], t) / 255;
          const g = mix(pal.ink[1], pal.accent[1], t) / 255;
          const b = mix(pal.ink[2], pal.accent[2], t) / 255;
          const x0 = Math.max(0, Math.floor(x - radius - 0.5));
          const x1 = Math.min(W - 1, Math.ceil(x + radius + 0.5));
          const y0 = Math.max(0, Math.floor(y - radius - 0.5));
          const y1 = Math.min(H - 1, Math.ceil(y + radius + 0.5));
          for (let py = y0; py <= y1; py++) {
            for (let px = x0; px <= x1; px++) {
              const cover = clamp(radius - Math.hypot(px + 0.5 - x, py + 0.5 - y) + 0.5, 0, 1) * alpha;
              if (cover <= 0) continue;
              const q = (py * W + px) * 4;
              const under = 1 - cover;
              paint[q] = r * cover + paint[q] * under;
              paint[q + 1] = g * cover + paint[q + 1] * under;
              paint[q + 2] = b * cover + paint[q + 2] * under;
              paint[q + 3] = cover + paint[q + 3] * under;
            }
          }
        }
        const out = image.data;
        for (let q = 0; q < paint.length; q += 4) {
          const a = paint[q + 3];
          if (a <= 0) {
            out[q + 3] = 0;
            continue;
          }
          out[q] = Math.round((255 * paint[q]) / a);
          out[q + 1] = Math.round((255 * paint[q + 1]) / a);
          out[q + 2] = Math.round((255 * paint[q + 2]) / a);
          out[q + 3] = Math.round(255 * a);
        }
        ctx.putImageData(image, 0, 0);
      }

      /* ---------------- playing and recording ---------------- */
      // Opened by hand, it plays. The recorder asks for one phase at a time (the first request stops the playing).
      let playing = 0;
      const tick = (now) => {
        render(now / 1000 / SECONDS);
        playing = requestAnimationFrame(tick);
      };
      window.loop = {
        stage: "#stage",
        render(phase) {
          cancelAnimationFrame(playing);
          playing = 0;
          render(phase);
        },
      };
      if (new URLSearchParams(location.search).has("dark")) document.documentElement.dataset.theme = "dark";
      addEventListener("load", () => (playing = requestAnimationFrame(tick)));
    </script>
  </body>
</html>
